name: Publish .NET global tool

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-global-tool
  cancel-in-progress: false

jobs:
  publish:
    name: Publish PetchNaka.ResxFormatter.Cli
    runs-on: windows-latest
    environment: nuget
    timeout-minutes: 15

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Resolve package version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)$') {
              throw "Tag '$tag' must use the form v<major>.<minor>.<patch>[-prerelease]."
          }

          "PACKAGE_VERSION=$($Matches.version)" >> $env:GITHUB_ENV

      - name: Validate trusted publishing configuration
        shell: pwsh
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
              throw "Set the repository variable 'NUGET_USER' to the nuget.org profile name."
          }

      - name: Test, pack, and validate tool
        shell: pwsh
        run: >
          ./scripts/Publish-GlobalTool.ps1
          -Version $env:PACKAGE_VERSION
          -Configuration Release
          -PackOnly

      - name: Log in to NuGet.org with trusted publishing
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish tool package
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: >
          ./scripts/Publish-GlobalTool.ps1
          -Version $env:PACKAGE_VERSION
          -Configuration Release
          -SkipTests
          -SkipPack
          -SkipPackageValidation
